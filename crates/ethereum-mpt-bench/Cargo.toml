[package]
name = "ethereum-mpt-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
sha3 = "0.10"
sp1-host = { path = "../sp1-host", default-features = false }
sp1-programs-common = { path = "../sp1-programs/common" }
sp1-sdk = { version = "6.2.2", features = ["blocking"] }

[build-dependencies]
sp1-build = "6.2.2"

[dev-dependencies]
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-trie = { version = "0.9.5", default-features = false }
