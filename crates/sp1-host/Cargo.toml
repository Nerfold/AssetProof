[package]
name = "sp1-host"
version = "0.1.0"
edition = "2021"

[features]
default = ["protocol-sp1"]
protocol-sp1 = ["dep:ark-bls12-381", "dep:ark-ec", "dep:ark-ff"]
smt-sp1 = ["dep:smt", "protocol-sp1"]
static-baseline = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "poa-protocol-sp1-setup"
path = "src/bin/protocol_setup.rs"

[dependencies]
ark-bls12-381 = { version = "0.6", optional = true }
ark-ec = { version = "0.6", optional = true }
ark-ff = { version = "0.6", optional = true }
bincode = "1.3.3"
common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
sp1-sdk = { version = "6.2.2", features = ["blocking", "profiling"] }
sp1-programs-common = { path = "../sp1-programs/common" }
smt = { path = "../smt", optional = true }
tracing = "0.1"

[build-dependencies]
sp1-build = "6.2.2"
