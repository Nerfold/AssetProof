[package]
name = "sp1-host"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
ark-bls12-381 = "0.6"
ark-ff = "0.6"
bincode = "1.3.3"
common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
sp1-sdk = { version = "6.2.2", features = ["blocking"] }
sp1-programs-common = { path = "../sp1-programs/common" }
smt = { path = "../smt" }

[build-dependencies]
sp1-build = "6.2.2"
