[package]
name = "sp1-cuda-worker"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
bincode = "1.3.3"
sp1-sdk = "=6.2.4"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "time"] }

# SP1 6.2 crates use caret requirements internally. Pin the complete proof
# stack so worker proof serialization cannot drift from the main process.
sp1-build = "=6.2.4"
sp1-core-executor = "=6.2.4"
sp1-core-executor-runner = "=6.2.4"
sp1-core-executor-runner-binary = "=6.2.4"
sp1-core-machine = "=6.2.4"
sp1-cuda = "=6.2.4"
sp1-curves = "=6.2.4"
sp1-derive = "=6.2.4"
sp1-hypercube = "=6.2.4"
sp1-jit = "=6.2.4"
sp1-primitives = "=6.2.4"
sp1-prover = "=6.2.4"
sp1-prover-types = "=6.2.4"
sp1-recursion-circuit = "=6.2.4"
sp1-recursion-compiler = "=6.2.4"
sp1-recursion-executor = "=6.2.4"
sp1-recursion-gnark-ffi = "=6.2.4"
sp1-recursion-machine = "=6.2.4"
sp1-verifier = "=6.2.4"
slop-air = "=6.2.4"
slop-algebra = "=6.2.4"
slop-alloc = "=6.2.4"
slop-baby-bear = "=6.2.4"
slop-basefold = "=6.2.4"
